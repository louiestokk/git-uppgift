    <script>
      function hamtaNamn(name) {
        return name;
      }

      // TODO 2: Returnera summan av a och b (just nu returneras alltid 0).
      function addera(a, b) {
       return Number(a) + Number(b) 
      
      }

      // TODO 3: Returnera "ok" om talet är större än 10, annars "för låg".

        if(Number(tal) > 10) return "ok"
        else return "för låg"
      }

      console.log(hamtaNamn("Louie Stokk"))
      console.log(addera(22,20))
