<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <title>Git-uppgift</title>
  </head>
  <body>
    <h1>Git-uppgift</h1>
    <div class="container"></div>

    <script>
        const container = document.querySelector(".container")
        const myName = document.createElement("h2")
        const summa = document.createElement("h3")
        summa.textContent = `Summa: ${addera(6,6)}`
        container.appendChild(summa)
        const talStatus = document.createElement("p")
        talStatus.textContent = statusForTal(15)
        container.appendChild(talStatus)

      function hamtaNamn(name) {
         myName.textContent = name;
        container.appendChild(myName)
      }

      function addera(a, b) {
       return Number(a) + Number(b) 
      
      }

      function statusForTal(tal) {
        if(Number(tal) > 10) return "ok"
        else return "för låg"
      }
     
    </script>
  </body>
</html>
